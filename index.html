
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>IBC 바코드 생성기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f4f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
    }

    .wrapper {
      background: #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      padding: 18px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #6b7280;
      margin: 0 0 16px;
    }

    .auth-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: #e5e7eb;
      color: #111827;
      white-space: nowrap;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      margin-bottom: 10px;
      font-size: 14px;
      background: #ffffff;
    }

    .barcode-item {
      background: #f9fafb;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      margin-bottom: 16px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      align-items: center;
    }

    .item-title {
      font-size: 13px;
      font-weight: 700;
    }

    .delete-btn {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .barcode-box {
      margin-top: 10px;
      border: 1px dashed #d1d5db;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      background: #fff;
      min-height: 90px;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      background: #1f2937;
      color: #fff;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .add-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .add-buttons button {
      flex: 1;
      padding: 12px;
      background: #4b5563;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .view-toggle-wrapper {
      margin-top: 14px;
      text-align: right;
    }

    .view-toggle-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #e5e7eb;
      color: #111827;
    }

    .view-toggle-btn span {
      font-weight: 700;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>

<body data-view="desktop">
  <div class="wrapper">
    <div class="header-row">
      <div>
        <h1 id="page-title">IBC 바코드 생성기 (PC)</h1>
        <p class="subtitle">CFS INC39 QC Sol</p>
      </div>
      <button id="auth-btn" class="auth-btn">인증하기</button>
    </div>

    <div id="items-container"></div>

    <div class="add-buttons">
      <button id="add-ibc-btn">+ IBC 바코드 추가</button>
      <button id="add-normal-btn">+ 일반 바코드 추가</button>
    </div>

    <div class="view-toggle-wrapper">
      <button id="view-toggle-btn" class="view-toggle-btn">
        <span>모바일로 보기</span>
      </button>
    </div>
  </div>

  <script>
    let itemCount = 0;
    let advancedUnlocked = false;

    const PRESET = {
      XP_N: "186-XP25-1-201",   // XP(안돈)
      XP_D: "186-XP25-1-901",   // XP(파괴검품)
      XM: "186-XM0-1-101",
      XX: "186-XX25-1-111",
      XC: "186-XC25-1-101"
    };

    const BASE_TYPES = [
      { value: "IBC", label: "IBC" },
      { value: "NORMAL", label: "일반" }
    ];

    const ADVANCED_TYPES = [
      { value: "XP_N", label: "XP(안돈)" },
      { value: "XP_D", label: "XP(파괴검품)" },
      { value: "XC", label: "XC" },
      { value: "XM", label: "XM" },
      { value: "XX", label: "XX" }
    ];

    function getViewMode() {
      return document.body.getAttribute("data-view") || "desktop";
    }

    function updateTitles() {
      const mode = getViewMode();
      const txt = mode === "desktop" ? "IBC 바코드 생성기 (PC)" : "IBC 바코드 생성기 (모바일)";
      const h1 = document.getElementById("page-title");
      if (h1) h1.textContent = txt;
      document.title = txt;
    }

    function populateTypeOptions(selectEl, preferredValue) {
      const prev = preferredValue || selectEl.value || "IBC";
      selectEl.innerHTML = "";

      BASE_TYPES.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.value;
        opt.textContent = t.label;
        selectEl.appendChild(opt);
      });

      if (advancedUnlocked) {
        ADVANCED_TYPES.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t.value;
          opt.textContent = t.label;
          selectEl.appendChild(opt);
        });
      }

      const values = Array.from(selectEl.options).map(o => o.value);
      selectEl.value = values.includes(prev) ? prev : "IBC";
    }

    function createItem(defaultType = "IBC") {
      itemCount++;

      const box = document.createElement("div");
      box.className = "barcode-item";

      box.innerHTML = `
        <div class="item-header">
          <span class="item-title">바코드 #${itemCount}</span>
          <button class="delete-btn">삭제</button>
        </div>

        <label class="label-vendor"></label>
        <input type="text" class="vendor-input">

        <label>바코드 유형 / 내용</label>
        <select class="type-select"></select>

        <input type="text" class="code-input" placeholder="">

        <div class="barcode-box">
          <svg class="barcode-svg"></svg>
        </div>

        <button class="action-btn"></button>
      `;

      const delBtn = box.querySelector(".delete-btn");
      delBtn.onclick = () => box.remove();

      const vendorLabel = box.querySelector(".label-vendor");
      const vendorInput = box.querySelector(".vendor-input");
      const typeSelect = box.querySelector(".type-select");
      const codeInput = box.querySelector(".code-input");
      const actionBtn = box.querySelector(".action-btn");

      function applyLabel() {
        if (typeSelect.value === "NORMAL") {
          vendorLabel.textContent = "상품명 / 로케이션";
          vendorInput.placeholder = "예: [로켓프레시][과일] 심봉산 사과 1.5kg (소과 / 8~10입)";
        } else {
          vendorLabel.textContent = "업체명";
          vendorInput.placeholder = "예: 바이애플";
        }
      }

      function updatePlaceholder() {
        const t = typeSelect.value;
        if (t === "IBC") codeInput.placeholder = "예: 121801113";
        else if (t === "NORMAL") codeInput.placeholder = "예: 8809806320808";
        else if (PRESET[t]) codeInput.placeholder = PRESET[t];
        else codeInput.placeholder = "";
      }

      function generate() {
        const svg = box.querySelector(".barcode-svg");
        const t = typeSelect.value;
        const txt = codeInput.value.trim();
        if (!txt) {
          svg.innerHTML = "";
          return;
        }
        const finalCode = t === "IBC" ? "IBC0" + txt : txt;
        JsBarcode(svg, finalCode, {
          format: "code128",
          width: 2,
          height: 80,
          displayValue: true
        });
      }

      async function toCanvas(svgEl, vendor) {
        const xml = new XMLSerializer().serializeToString(svgEl);
        const blob = new Blob([xml], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);

        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("이미지 변환 실패"));
          i.src = url;
        });

        URL.revokeObjectURL(url);

        const vh = vendor ? 30 : 0;
        const canvas = document.createElement("canvas");
        canvas.width = img.width + 40;
        canvas.height = img.height + vh + 40;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (vendor) {
          ctx.fillStyle = "#111827";
          ctx.font = "20px Apple SD Gothic Neo, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(vendor, canvas.width / 2, 18);
        }

        ctx.drawImage(img, 20, vh + 20);
        return canvas;
      }

      async function downloadPNG() {
        const svg = box.querySelector(".barcode-svg");
        if (!svg || !svg.innerHTML.trim()) {
          alert("먼저 바코드를 입력해 주세요.");
          return;
        }
        const vendor = vendorInput.value.trim() || "barcode";
        try {
          const canvas = await toCanvas(svg, vendor);
          canvas.toBlob((blob) => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = vendor + "_barcode.png";
            a.click();
          }, "image/png");
        } catch (e) {
          alert("이미지 저장 중 오류가 발생했습니다.");
        }
      }

      async function copyImage() {
        const svg = box.querySelector(".barcode-svg");
        if (!svg || !svg.innerHTML.trim()) {
          alert("먼저 바코드를 입력해 주세요.");
          return;
        }
        if (!("clipboard" in navigator) || typeof ClipboardItem === "undefined") {
          alert("이미지 복사는 데스크톱 크롬/엣지 최신 버전에서만 지원됩니다.");
          return;
        }
        const vendor = vendorInput.value.trim() || "barcode";
        try {
          const canvas = await toCanvas(svg, vendor);
          canvas.toBlob(async (blob) => {
            if (!blob) {
              alert("이미지 생성에 실패했습니다.");
              return;
            }
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
            alert("이미지가 클립보드에 복사되었습니다.");
          }, "image/png");
        } catch (e) {
          alert("이미지 복사 중 오류가 발생했습니다.");
        }
      }

      // 타입 옵션 채우기 + 기본 선택
      populateTypeOptions(typeSelect, defaultType);

      // 라벨/플레이스홀더 초기 세팅
      applyLabel();
      updatePlaceholder();

      // 타입 변경 시
      typeSelect.onchange = () => {
        if (PRESET[typeSelect.value]) {
          codeInput.value = PRESET[typeSelect.value];
        }
        applyLabel();
        updatePlaceholder();
        generate();
      };

      // 코드 변경 시
      codeInput.oninput = generate;

      // 액션 버튼 동작
      actionBtn.onclick = () => {
        getViewMode() === "desktop" ? copyImage() : downloadPNG();
      };

      // 액션 버튼 라벨
      updateActionButtonLabel(actionBtn);

      document.getElementById("items-container").appendChild(box);
    }

    function updateActionButtonLabel(btn) {
      const mode = getViewMode();
      btn.textContent = mode === "desktop" ? "이미지 복사" : "이미지 저장";
    }

    function updateAllActionButtons() {
      document.querySelectorAll(".action-btn").forEach(updateActionButtonLabel);
    }

    // 뷰 토글
    const viewToggleBtn = document.getElementById("view-toggle-btn");
    viewToggleBtn.addEventListener("click", () => {
      const current = getViewMode();
      const next = current === "desktop" ? "mobile" : "desktop";
      document.body.setAttribute("data-view", next);
      viewToggleBtn.querySelector("span").textContent =
        next === "desktop" ? "모바일로 보기" : "PC로 보기";
      updateTitles();
      updateAllActionButtons();
    });

    // 인증 버튼
    const authBtn = document.getElementById("auth-btn");
    authBtn.addEventListener("click", () => {
      const code = prompt("인증 코드를 입력하세요.");
      if (code === "3939") {
        advancedUnlocked = true;
        alert("인증 완료");
        document.querySelectorAll(".type-select").forEach(sel => {
          populateTypeOptions(sel, sel.value);
        });
      } else if (code !== null) {
        alert("인증 코드가 올바르지 않습니다.");
      }
    });

    // 추가 버튼 이벤트
    document.getElementById("add-ibc-btn").onclick = () => createItem("IBC");
    document.getElementById("add-normal-btn").onclick = () => createItem("NORMAL");

    // 초기 세팅
    updateTitles();
  </script>
</body>
</html>
